name: Search matrix audit

on:
  push:
    branches:
      - audit/search-matrix-20260825

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit production search modes
        run: node scripts/search-audit.mjs
